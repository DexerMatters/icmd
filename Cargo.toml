[package]
name = "icmd"
version = "0.1.0"
edition = "2024"

[dependencies]
chafa-sys = "0.1.4"
crossbeam-channel = "0.5.16"
crossterm = "0.29.0"
flate2 = "1"
fmt-derive = "0.1.2"
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "gif", "webp"] }
slotmap = "1.1.1"
unicode-segmentation = "1.12.0"
unicode-width = "0.2.1"
textwrap = { version = "=0.16.2", default-features = false, features = ["unicode-linebreak", "unicode-width"] }

[dev-dependencies]
criterion = "0.5"
trybuild = "1.0"

[[bench]]
name = "rendering"
harness = false
