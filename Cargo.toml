[package]
name = "icmd"
version = "0.1.0"
edition = "2024"
rust-version = "1.88"
description = "A retained, terminal-native UI framework with Unicode-aware text, transactional frame validation, and optional native raster rendering."
license = "MIT OR Apache-2.0"
readme = "README.md"
repository = "https://github.com/example/icmd"
keywords = ["tui", "terminal", "ui", "unicode", "widgets"]
categories = ["command-line-interface", "gui"]
# Planning documents, local scratch state, and demo media must never ship in a
# published package. Everything else is included implicitly.
exclude = [
    "agents/",
    ".scratch/",
    "examples/res/",
    "fixtures/",
    "target/",
]

# The downstream fixture is a real dependent crate: it compiles against the
# published high-level surface and fails if an internal item leaks into it.
[workspace]
members = ["fixtures/high-level", "fixtures/advanced"]

[features]
default = ["native-raster"]
# Native Chafa-backed raster encoding (Kitty/Sixel/iTerm2 payloads and symbol
# rendering). Requires pkg-config, the Chafa development package, and libclang
# at build time. Disable it for a pure-Rust build that only emits cell output.
native-raster = ["dep:chafa-sys"]

[dependencies]
chafa-sys = { version = "0.1.4", optional = true }
crossbeam-channel = "0.5.16"
crossterm = "0.29.0"
flate2 = "1"
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "gif", "webp"] }
slotmap = "1.1.1"
unicode-segmentation = "1.12.0"
unicode-width = "0.2.1"
textwrap = { version = "=0.16.2", default-features = false, features = ["unicode-linebreak", "unicode-width"] }

[dev-dependencies]
criterion = "0.5"
trybuild = "1.0"

[[bench]]
name = "rendering"
harness = false

# The parameterized workload matrix from the performance plan. It records
# workload size and structural counters alongside elapsed time.
[[bench]]
name = "matrix"
harness = false
