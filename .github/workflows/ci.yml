# One job per release gate from the productization roadmap. `pure-rust` exists
# specifically to prove the crate builds without Chafa, pkg-config, or libclang.
name: CI

on:
  push:
  pull_request:

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: -D warnings

jobs:
  pure-rust:
    name: pure Rust (no native raster)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - run: cargo fmt --all -- --check
      - run: cargo clippy --all-targets --no-default-features -- -D warnings
      - run: cargo test --no-default-features
      - name: Markdown parser (pure Rust)
        run: cargo test --no-default-features --features markdown
      - name: Downstream high-level fixture
        run: cargo build -p icmd-high-level-fixture --no-default-features

  native-raster:
    name: native raster (${{ matrix.runner }})
    strategy:
      fail-fast: false
      matrix:
        # The older runner image carries a lower Chafa; the newer one carries a
        # higher one. Together they pin the supported ABI range that `build.rs`
        # enforces.
        runner: [ubuntu-22.04, ubuntu-latest]
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - name: Install Chafa
        run: sudo apt-get update && sudo apt-get install -y libchafa-dev pkg-config clang
      - name: Report the discovered ABI
        run: pkg-config --modversion chafa
      - run: cargo clippy --all-targets --all-features -- -D warnings
      - run: cargo test --all-features
      # The documentation binary requires the native raster prerequisites, so it
      # is built and tested only where Chafa, pkg-config, and libclang exist. Its
      # tests commit every chapter at four terminal sizes in both themes and
      # compile every displayed snippet against the public API.
      - name: Documentation tool (cargo-icmd)
        run: cargo test -p cargo-icmd
      # `--no-deps` keeps this gate on the documentation tool's own code: the
      # framework is linted by the workspace-wide step above.
      - name: Documentation tool lints
        run: cargo clippy -p cargo-icmd --all-targets --no-deps -- -D warnings
      - name: Downstream advanced fixture (native features)
        run: cargo build -p icmd-advanced-fixture

  msrv:
    name: minimum supported Rust version
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # The declared MSRV must build the default (pure-Rust) feature set.
      - uses: dtolnay/rust-toolchain@1.88
      - run: cargo build --no-default-features

  miri:
    name: Miri on the unsafe-free core
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@nightly
        with:
          components: miri
      - name: Miri (pure-Rust core paths)
        run: |
          # Miri cannot model the Chafa FFI boundary, so it runs the
          # no-native-raster build where every path is pure Rust.
          MIRIFLAGS="-Zmiri-disable-isolation" cargo miri test --no-default-features --lib

  supply-chain:
    name: package and dependency gates
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Install Chafa
        run: sudo apt-get update && sudo apt-get install -y libchafa-dev pkg-config clang
      - name: Install cargo-audit
        run: cargo install cargo-audit --locked
      - run: cargo audit
      - name: Package content allowlist
        run: cargo package --allow-dirty
      - name: Packaged crate builds standalone
        run: |
          cd target/package
          tar xzf icmd-*.crate
          cd icmd-*/
          cargo build --no-default-features
      # The documentation tool ships its own raster asset and displayed
      # snippets, so its package contents are validated explicitly rather than
      # assumed from the framework's exclude list.
      - name: Documentation tool package includes assets and snippets
        run: |
          cargo package -p cargo-icmd --list --allow-dirty > /tmp/cargo-icmd-files.txt
          grep -q '^assets/guide.png$' /tmp/cargo-icmd-files.txt
          grep -q '^assets/README.md$' /tmp/cargo-icmd-files.txt
          grep -q '^snippets/release_card.rs$' /tmp/cargo-icmd-files.txt
          grep -q '^src/chapters/ch10_api.rs$' /tmp/cargo-icmd-files.txt
