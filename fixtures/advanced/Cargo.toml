# Downstream compile fixture for the advanced tier. It enables icmd's
# native-raster feature, which is opt-in rather than default, so this build
# covers the native path; it also exercises typed frame construction rather than
# raw operation lists.
[package]
name = "icmd-advanced-fixture"
version = "0.2.0"
edition = "2024"
publish = false

[dependencies]
icmd = { path = "../..", features = ["native-raster"] }
