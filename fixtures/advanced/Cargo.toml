# Downstream compile fixture for the advanced tier. It depends on icmd with its
# default features, so this build also covers the native-raster path, and it
# exercises typed frame construction rather than raw operation lists.
[package]
name = "icmd-advanced-fixture"
version = "0.0.0"
edition = "2024"
publish = false

[dependencies]
icmd = { path = "../.." }
